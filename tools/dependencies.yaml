# Runtime dependency manifest for VisionRT
# 机器相关依赖默认路径的唯一真相源（SSOT）：换机器只需改本文件，无需改 cmake/*.cmake。
# root may be a path or a variable read from CMakeCache.txt / the listed CMake file.
# default defines the local default path; <platform>_default (windows/linux/macos) 优先于 default。
# CMake 侧消费入口：cmake/ConfigDependencyDefaults.cmake（visionrt_dependency_default / DEPENDENCY 参数）。
dependencies:
  - name: qt
    cmake: cmake/ConfigQT.cmake
    root: Qt6_ROOT
    default: E:/Softwares/Qt/6.11.0/msvc2022_64

  - name: opencv
    cmake: cmake/ConfigOpenCV.cmake
    root: OpenCV_HOME
    windows_root: OpenCV_BIN_DIR
    default: D:/Software/opencv/build/x64/vc16
    destinations:
      - build/bin
    windows:
      - "*.dll"
      - bin/*.dll

  - name: python
    cmake: cmake/ConfigPython.cmake
    root: PYTHON_HOME
    default: E:/Softwares/Anaconda3/envs/py312
    destinations:
      - build/bin
    windows:
      - python3*.dll
      - zlib*.dll
