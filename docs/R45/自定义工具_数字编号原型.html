})(globalThis);

function move(delta){const p=port();if(!p||p.fixed)return;const a=business(),i=a.indexOf(p),j=i+delta;if(j<0||j>=a.length)return;M.move(tool(),tab,p.id,j);rows();properties();status();}$('upPort').onclick=()=>move(-1);$('downPort').onclick=()=>move(1);
function confirm(title,text,action){$('confirmTitle').textContent=title;$('confirmText').textContent=text;confirmAction=action;$('confirmModal').classList.add('open');}$('confirmOk').onclick=()=>{$('confirmModal').classList.remove('open');confirmAction?.();confirmAction=null;};$('deletePort').onclick=()=>{const p=port();if(!p||p.fixed)return;confirm('删除参数',`删除“${p.name}”？`,()=>{M.remove(tool(),tab,p.id);selectedPortId=null;render();});};
$('newTool').onclick=()=>{$('newError').textContent='';$('newModal').classList.add('open');};$('createTool').onclick=()=>{const name=$('newName').value.trim(),id=$('newId').value.trim(),kind=$('newKind').value;if(!name||!/^[A-Za-z][A-Za-z0-9_.]*$/.test(id)||tools.some(t=>t.id===id)){$('newError').textContent='名称不能为空，标识须合法且唯一';return;}tools.push({id,name,kind,category:'自定义',next_port_id:{init:0,inputs:1,outputs:2},inputs:[],outputs:[],init:[],code:template(kind)});selectedTool=id;tab='inputs';selectedPortId=null;$('newModal').classList.remove('open');render();};
$('cloneTool').onclick=()=>{const t=clone(tool());let n=1;while(tools.some(x=>x.id===t.id+'_copy'+n))n++;t.id+='_copy'+n;t.name+=' 副本';tools.push(t);selectedTool=t.id;selectedPortId=null;render();};$('deleteTool').onclick=()=>{const t=tool();if(!t)return;confirm('删除工具',`删除“${t.name}”？`,()=>{tools=tools.filter(x=>x!==t);saved=saved.filter(x=>x.id!==t.id);selectedTool=tools[0]?.id||null;selectedPortId=null;render();});};
class RawJson{constructor(text){JSON.parse(text);this.text=text;}}function jsonText(v,depth=0){if(v instanceof RawJson)return v.text;const pad='  '.repeat(depth),next='  '.repeat(depth+1);if(Array.isArray(v))return v.length?'[\n'+v.map(x=>next+jsonText(x,depth+1)).join(',\n')+'\n'+pad+']':'[]';if(v&&typeof v==='object'){const entries=Object.entries(v);return entries.length?'{\n'+entries.map(([k,x])=>next+JSON.stringify(k)+': '+jsonText(x,depth+1)).join(',\n')+'\n'+pad+'}':'{}';}return JSON.stringify(v);}
function literal(p,v){if(p.type==='string')return v;if(p.type==='int'){if(!/^-?\d+$/.test(v))throw Error(p.name+'需要整数');const n=BigInt(v);if(n<-(1n<<63n)||n>(1n<<63n)-1n)throw Error(p.name+'超出 Int64 范围');return new RawJson(v);}if(p.type==='float'){if(!v.trim()||!Number.isFinite(Number(v)))throw Error(p.name+'需要有限数值');return new RawJson(v);}if(p.type==='bool'){if(v!=='true'&&v!=='false')throw Error(p.name+'需要 true 或 false');return v==='true';}if(p.type==='roi'||p.type.startsWith('vec_')){if(!Array.isArray(JSON.parse(v)))throw Error(p.name+'需要 JSON 数组');return new RawJson(v);}return undefined;}
function definition(){const t=tool(),ports={};M.validate(t);if(!t.name.trim())throw Error('工具名称不能为空');for(const stage of ['init','inputs','outputs']){if(!t[stage].length)continue;ports[stage]=t[stage].map(p=>{if(!p.name.trim())throw Error('参数名称不能为空');const out={id:p.id,name_zh:p.name,type:p.type};if(p.alias?.trim())out.name_en=p.alias.trim();if(stage!=='outputs'&&p.type!=='image'&&p.value!==undefined)out.default=literal(p,p.value);if(stage!=='outputs'&&['int','float'].includes(p.type)){const c={};if(p.min)c.min=literal(p,p.min);if(p.max)c.max=literal(p,p.max);if(Object.keys(c).length)out.constraints=c;}if(p.page&&p.page!=='基本输入'&&stage==='inputs')out.ui={tab:p.page};return out;});}return {schema_version:6,name_en:t.id,name_zh:t.name,version:'1.0.0',next_port_id:{...t.next_port_id},implementation:{kind:t.kind,package:t.id.replaceAll('.','/'),file:'tool.py',symbol:t.kind==='python_function'?'execute':'Tool'},ui:{category:t.category.split('/').map(x=>x.trim()).filter(Boolean)},ports};}
function preview(){try{$('jsonText').textContent=jsonText(definition());$('jsonModal').classList.add('open');}catch(e){status(e.message,true);}}$('showJson').onclick=preview;$('downloadJson').onclick=()=>{const blob=new Blob([$('jsonText').textContent+'\n'],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=tool().id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);};
$('apply').onclick=()=>{try{jsonText(definition());const t=tool();for(const stage of ['inputs','outputs','init'])for(const p of t[stage])p.committed=true;const i=saved.findIndex(x=>x.id===t.id);if(i<0)saved.push(clone(t));else saved[i]=clone(t);properties();status('已应用到原型');}catch(e){status(e.message,true);}};$('revert').onclick=()=>{const previous=saved.find(t=>t.id===selectedTool);if(previous)tools[tools.findIndex(t=>t.id===selectedTool)]=clone(previous);else{tools=tools.filter(t=>t.id!==selectedTool);selectedTool=tools[0]?.id||null;}selectedPortId=null;render();};$('resetDemo').onclick=()=>{tools=clone(initial);saved=clone(initial);selectedTool=tools[0].id;tab='inputs';selectedPortId=1;$('search').value='';render();};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('open'));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('open'));});
window.visionrtPrototype={getDefinition:()=>jsonText(definition()),getTools:()=>clone(tools),getFixedRows:()=>fixed().map(p=>p.id),setTab:v=>{tab=v;selectedPortId=null;render();}};render();})();
